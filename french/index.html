function parseID(id){
 let m;if((m=/^g-(\d+)-(\d+)$/.exec(id))&&GRAMMAR[+m[1]]?.q[+m[2]])return{kind:'grammar',m:+m[1],q:+m[2]};
 if((m=/^e-(\d+)$/.exec(id))&&PAST_EXAM[+m[1]])return{kind:'exam',q:+m[1]};
 if((m=/^c-([^~]+)~([^~]+)~([0-5])~([mf])$/.exec(id))&&Object.hasOwn(V,m[1])&&TENSE_IDS.includes(m[2])&&(m[2]!=='conditionnel'||[0,4].includes(+m[3])))return{kind:'conj',inf:m[1],t:m[2],p:+m[3],g:m[4]};
 return null;
}
function validate(raw){

 const s=blank();
 if(!Array.isArray(raw.completed)||raw.completed.length!==8||raw.completed.some(x=>typeof x!=='boolean'))throw Error('模块进度格式不正确');
 if(!Array.isArray(raw.checks)||raw.checks.length!==4||raw.checks.some(x=>typeof x!=='boolean'))throw Error('验收记录格式不正确');
 s.completed=raw.completed.slice();s.checks=raw.checks.slice();s.completed[7]=s.checks.every(Boolean);
 if(raw.writing!==undefined&&(typeof raw.writing!=='string'||raw.writing.length>30000))throw Error('写作记录格式不正确');s.writing=raw.writing||'';
 for(const field of ['answers','mastery','wrong'])if(!raw[field]||typeof raw[field]!=='object'||Array.isArray(raw[field]))throw Error('缺少 '+field+' 数据');
 for(const [id,list] of Object.entries(raw.answers)){
  if(!parseID(id)||!Array.isArray(list)||list.length>50000)throw Error('答题记录格式不正确');
  s.answers[id]=list.map(a=>{if(!a||typeof a.ok!=='boolean'||typeof a.input!=='string'||a.input.length>500||typeof a.at!=='string'||!Number.isFinite(Date.parse(a.at)))throw Error('答题记录损坏');return{ok:a.ok,input:a.input,at:a.at};});
 }
 for(const [id,w] of Object.entries(raw.wrong)){
  if(!parseID(id)||!w||!Number.isSafeInteger(w.count)||w.count<1||typeof w.resolved!=='boolean'||typeof w.lastAt!=='string'||!Number.isFinite(Date.parse(w.lastAt)))throw Error('错题格式不正确');
  s.wrong[id]={count:w.count,resolved:w.resolved,lastAt:w.lastAt};
 }
 for(const [key,m] of Object.entries(raw.mastery)){
  const [inf,t,g,...extra]=key.split('~');const target=t==='conditionnel'?[0,4]:[0,1,2,3,4,5];
  if(extra.length||!Object.hasOwn(V,inf)||!TENSE_IDS.includes(t)||!['m','f'].includes(g)||!m||!Array.isArray(m.streak)||m.streak.some(p=>!target.includes(p))||new Set(m.streak).size!==m.streak.length||typeof m.mastered!=='boolean')throw Error('掌握表格式不正确');
  if(m.mastered&&m.streak.length!==target.length)throw Error('掌握记录不完整');
  s.mastery[key]={streak:m.streak.slice(),mastered:m.mastered};
 }
 return s;
}

 else if(state.wrong[id])state.wrong[id].resolved=true;

function trainerView(){let s=jump(5)+'<p class="eyebrow">模块 06 · ÉCRIRE DE MÉMOIRE</p><h1>变位训练器</h1><p class="muted">'+VERBS.length+' 个动词 · 5 种时态 · 一局 10 题。输入动词形式，不写主语；例如 nous + parler → <span lang="fr">parlons</span>。</p>';

 s+='<section class="panel"><h2>这局练什么</h2><div class="filters"><label>动词池<select id="pool">'+options([['all','全部 '+VERBS.length+' 个'],['template','8 个模板动词'],['pp','40 个过去分词对应动词'],['er','规则 -er 组 10 个'],['ir','规则 -ir 组 10 个'],['re','规则 -re 组 10 个']],config.pool)+'</select></label><label>时态<select id="tense">'+options([['all','混合五种时态'],...TENSE_IDS.map((t,i)=>[t,TENSES[i]])],config.tense)+'</select></label><label class="full">动词（指定一个，更容易练齐六格）<select id="verb">'+options([['all','池内随机'],...poolVerbs().map(v=>[v.inf,v.inf+' · '+v.zh])],config.verb)+'</select></label><label class="full">主语性别（用于 être 过去分词配合）<select id="gender">'+options([['m','男性单数 / 男性或混合复数组'],['f','女性单数 / 全体女性复数组']],config.gender)+'</select></label></div><p class="muted">vous 固定表示“你们”（复数）。sortir / monter / descendre 在训练器中表示不带直接宾语的移动。</p><button class="primary" data-action="start">开始 10 题 →</button></section><details><summary>判分与“已掌握”怎么算</summary><p>忽略首尾空白；重音、大小写和内部空格都要正确。输入与键盘组合重音会按同一 Unicode 字符识别，但 é 与 e 不等价。</p><p>每个动词、每个时态分别记录：连续答对 6 个不同人称，记为已掌握；同一格重复答对不多计，答错就清空该组连续记录并撤销掌握。穿插其他动词不打断，跨局保留；复合过去时男女配合分开记。</p><p>条件式按原稿只考 je / vous，因此以 2 / 2 单列为“礼貌用法已掌握”，不会冒充六人称已掌握。</p><p>指定动词＋时态时，先随机出完一轮人称再重复；总题数仍为 10。</p></details>'+masteryHTML()+referenceHTML()+completion(5);return s;
}
function roundHTML(){const done=round.index>=round.questions.length;if(done){const pct=Math.round(round.correct/round.questions.length*100);return'<section class="panel"><p class="eyebrow">'+(round.mode==='accept'?'120 格验收':'本局完成')+'</p><h2>'+pct+'% · '+round.correct+' / '+round.questions.length+'</h2><p>答错的已经收进错题本。先重写错格，再开始新一局。</p>'+(round.mode==='accept'?'<p class="'+(pct>=90?'correct':'incorrect')+'">'+(pct>=90?'达到 ≥90% 的验收标准，可回验收页勾选第一项。':'还没达到 ≥90%，回看错格后再试。')+'</p>':'')+'<div class="actions"><button class="primary" data-action="again">再练一局</button><button data-action="endRound">调整范围</button><button data-route="wrong">去错题本</button></div></section>'+masteryHTML()+completion(5);}
 const q=round.questions[round.index],v=V[q.inf],key=masteryKey(q),m=state.mastery[key];return'<section class="panel"><div class="between"><span>'+(round.mode==='accept'?'验收':'本局')+' '+(round.index+1)+' / '+round.questions.length+'</span><span>已答对 '+round.correct+' 题</span></div><progress value="'+round.index+'" max="'+round.questions.length+'" aria-label="本局已答题数"></progress><p class="eyebrow" style="margin-top:24px">'+esc(v.zh)+'</p><h2>'+esc(conjPrompt(q))+'</h2><p class="muted">本组连续覆盖 '+(m?.streak.length||0)+' / '+(q.t==='conditionnel'?2:6)+' 人称</p><form id="trainerForm"><label for="conjInput">只写动词形式</label><input id="conjInput" class="field" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="120" required '+(round.answered?'disabled':'')+' value="'+(round.answered?esc(round.lastInput):'')+'">'+accentBar('conjInput')+'<button class="primary" type="submit" '+(round.answered?'disabled':'')+'>核对答案</button></form><div id="conjFeedback" role="status">'+(round.answered?feedbackHTML(idConj(q),round.lastInput,round.lastOK):'')+'</div>'+(round.answered?'<button class="primary" data-action="next" style="margin-top:18px">'+(round.index+1===round.questions.length?'看本局结果':'下一题 →')+'</button>':'')+'</section><button class="ghost" data-action="endRound">结束本局，保留已答记录</button>';
}
function masteryHTML(){const list=Object.entries(state.mastery).sort((a,b)=>Number(b[1].mastered)-Number(a[1].mastered));const mastered=list.filter(([,m])=>m.mastered);return'<details><summary>已掌握 '+mastered.length+' 组 · 查看覆盖情况</summary>'+(list.length?list.map(([key,m])=>{const[inf,t,g]=key.split('~');return'<p><strong>'+esc(inf)+'</strong> · '+TENSES[TENSE_IDS.indexOf(t)]+(t==='passe'?'（'+(g==='f'?'女性':'男性／混合')+'）':'')+'<br><span class="'+(m.mastered?'correct':'muted')+'">'+(m.mastered?'✓ '+(t==='conditionnel'?'礼貌用法已掌握':'六人称已掌握'):'连续覆盖 '+m.streak.length+' / '+(t==='conditionnel'?2:6))+'</span></p>';}).join(''):'<p class="muted">先默写，覆盖同一组的不同人称。</p>')+'</details>';}
function referenceHTML(){return'<details><summary>先记三张词尾表与八个模板</summary><p>-er（parler）：e / es / e / ons / ez / ent<br>-ir（finir）：is / is / it / issons / issez / issent<br>-re（vendre）：s / s / 零词尾 / ons / ez / ent</p><p>规则 -re 的 il vend 没有额外的 -t；prendre 属于另一个模板：prends / prends / prend / prenons / prenez / prennent，不能拿它推 vendre。</p><p>venir 家族：tenir / devenir / revenir / obtenir；venir / tenir 各按自己的词根变化，带前缀的词沿用对应形式，但助动词分别记：venir / devenir / revenir 用 être，tenir / obtenir 用 avoir。</p><p>-oir 不是统一的变位模板：pouvoir、vouloir、devoir、savoir、voir 的词干各记一份。</p>'+TEMPLATE.map(inf=>tableHTML({inf,t:'present',g:'m'})).join('')+'</details><details><summary>40 个高频过去分词</summary><p>前 10 个是原稿的 -é 组，其余 30 个保留原稿顺序；后组也含 resté / tombé / monté，不全是 -i / -u。</p>'+PP40.map(inf=>'<div class="word"><span class="fr" lang="fr">'+inf+' → '+V[inf].pp+'</span><br><small>'+V[inf].zh+' · 助动词 '+V[inf].aux+'</small></div>').join('')+'<p>sortir / monter / descendre 带直接宾语时改用 avoir：elle a sorti le livre，elle a monté la valise；单纯移动用 être：elle est sortie，elle est montée。代词式动词的配合另见规则 3.2。</p></details><details><summary>查询任意动词的六人称表</summary><label>动词<select id="refVerb" class="field">'+options(VERBS.map(v=>[v.inf,v.inf+' · '+v.zh]),'parler')+'</select></label><label>时态<select id="refTense" class="field">'+options(TENSE_IDS.map((t,i)=>[t,TENSES[i]]),'present')+'</select></label><label>配合<select id="refGender" class="field"><option value="m">男性／混合</option><option value="f">全体女性</option></select></label><div id="refTable">'+tableHTML({inf:'parler',t:'present',g:'m'})+'</div></details>';}
function vocabView(){return jump(6)+'<p class="eyebrow">模块 07 · LES MOTS EN CONTEXTE</p><h1>200 个词，带着短语记</h1><p class="muted">每组 25 条。“l’”会隐藏词性，后面的 un / une 或配合帮你认；œil 的复数是 yeux，注意这个特殊变化。</p><label for="wordSearch">搜法语、中文或短语</label><input id="wordSearch" type="search" class="field" placeholder="比如：école、家、du pain"><label class="check"><input id="hideMeaning" type="checkbox"><span>遮住中文，自测意思</span></label><div id="words">'+wordsHTML('')+'</div><div class="notice">这 200 条是起步材料。读短文时继续摘词，写成“冠词＋词＋一个短语”；下次先回忆上次的词，再加新词。</div>'+completion(6);}
function wordsHTML(query){const term=query.trim().toLocaleLowerCase('fr');let count=0;const content=VOCAB.map(group=>{const words=group.words.filter(w=>w.join(' ').toLocaleLowerCase('fr').includes(term));count+=words.length;return words.length?'<details'+(term?' open':'')+'><summary>'+group.theme+' · '+words.length+' 条</summary>'+words.map(w=>'<div class="word"><div class="word-head"><strong class="fr" lang="fr">'+esc(w[0])+'</strong><span class="meaning">'+esc(w[1])+'</span></div><div class="fr" lang="fr">'+esc(w[2])+'</div>'+speechButton(w[2])+'</div>').join('')+'</details>':'';}).join('');return'<p class="muted">'+count+' / 200 条</p>'+content;}
function acceptanceView(){return jump(7)+'<p class="eyebrow">模块 08 · À TOI DE JOUER</p><h1>能独立完成，就勾上</h1><p class="muted">四项全过才算完成。这里验收的是“认得、能默写、能造句”，之后继续靠短文写作巩固。</p>'+[
 ['20 个高频动词 × 6 人称：现在时 ≥ 90%','遮住参考表，默写 120 格，至少 108 格正确；重音算错。内置验收覆盖下面 20 个动词，题目不重复，作答时不许翻表。','<p class="fr" lang="fr">'+EXAM20.join(' · ')+'</p><button class="primary" data-action="acceptPresent">开始 120 格验收</button><p class="muted">验收局可在页面内切换查看，刷新后需重开；已提交的每题仍保存。</p>'],
 ['复合过去时 20 题：至少答对 16 题','一次完成后再统计第一遍成绩；检查助动词、过去分词、性数配合，三个都正确才算一题。订正后可重新开一轮。','<button class="primary" data-route="pastExam">打开 20 题验收</button>'],
 ['150 词 A2 短文：指出每个动词的时态和原形','先在纸上圈出所有动词，再标原形与时态；不定式也标出来，助动词和过去分词视为一个整体，最后打开核对表逐项检查。','<p class="reading" lang="fr">'+READING+'</p>'+speechButton(READING)+'<details><summary>写完再打开：24 处动词核对表</summary><div class="table-wrap"><table><thead><tr><th>文中形式</th><th>原形</th><th>时态／形式</th></tr></thead><tbody>'+READING_KEY.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p>按空格计 150 词；复合形式、近将来整体标注。voudrait écrire 中 voudrait 为条件式，écrire 为不定式；voudrait 是文中的第三人称识别练习，默写范围仍只有 je / vous。</p></details>'],
 ['冠词、名词、形容词、动词、否定：各造 5 句，语法错 ≤ 2','按原稿“各造 5 句”准备 5 组、共 25 句，每组突出一个项目，并尽量同时使用其他项目；写完逐句检查性数、冠词、动词人称、否定位置，累计语法错误不超过 2 处。','<p>建议请老师或可靠的批改者检查自由造句；这个离线页面不会自动判定任意句子的语法。可先用自查表修订，再以独立重写的版本验收。</p><details><summary>自查与参考句</summary><p>① 冠词是否与性数、否定相符？② 名词复数是否正确？③ 形容词位置、性数是否一致？④ 动词人称与时态是否正确？⑤ ne…pas 是否包住变位动词？</p>'+examples([['Ma petite sœur ne mange pas de viande.','我的小妹妹不吃肉。'],['Les grandes maisons ne sont pas blanches.','这些大房子不是白色的。'],['Je n’ai pas acheté de nouvelle robe.','我没有买新的连衣裙。']])+'</details><label for="writing">我的句子与批改记录（自动保存）</label><textarea id="writing" class="field" rows="10" maxlength="30000" placeholder="每组写 5 句，也可以记下纸上练习的结果。">'+esc(state.writing)+'</textarea>']
 ].map(([title,text,body],i)=>'<section class="panel"><h2>'+title+'</h2><p>'+text+'</p>'+body+'<label class="check"><input type="checkbox" data-check="'+i+'" '+(state.checks[i]?'checked':'')+'><span>我已按标准自测通过这一项</span></label></section>').join('')+'<p id="acceptStatus" class="notice">'+(state.checks.every(Boolean)?'四项已通过，验收模块已完成。接着继续写自己的短文。':'完成 '+state.checks.filter(Boolean).length+' / 4 项；全部勾选后自动完成本模块。')+'</p>';}
let pastSession=null;
function pastExamView(){if(!pastSession)pastSession={};return'<button class="ghost" data-route="m7">← 回验收</button><h1>复合过去时 · 20 题</h1><p>每题填完整形式（助动词＋过去分词）；代词式动词按题目要求加反身代词。按本轮首次提交计分，至少 16 / 20；刷新会重置本轮统计，逐题记录仍保留。</p><p class="notice" id="pastScore">'+pastScoreText()+'</p><button data-action="restartPast">重新开一轮</button>'+PAST_EXAM.map((_,i)=>quizHTML('e-'+i,i+1)).join('');}
function pastScoreText(){const vals=Object.values(pastSession||{});return'本轮首次作答 '+vals.length+' / 20 · 正确 '+vals.filter(Boolean).length+(vals.length===20?' / 20（'+(vals.filter(Boolean).length>=16?'达到验收标准，可回去勾选第二项':'未达到 16 题，订正后再试')+'）':'；完整做完再判断是否通过。');}
function wrongView(){const entries=Object.entries(state.wrong).sort((a,b)=>b[1].lastAt.localeCompare(a[1].lastAt));const open=entries.filter(([,w])=>!w.resolved),fixed=entries.filter(([,w])=>w.resolved);return'<p class="eyebrow">REPRENDRE · 从错处继续</p><h1>错题本</h1><p class="muted">待订正 '+open.length+' 题 · 已订正 '+fixed.length+' 题。重答正确会标为已订正；以后再错会重新出现，历史记录保留。</p>'+(open.length?open.map(([id,w],i)=>'<p class="muted">累计答错 '+w.count+' 次</p>'+quizHTML(id,i+1,true)).join(''):'<div class="panel empty">暂时没有待订正的错题。<br>去练一局，看看哪些已经会了。</div>')+(fixed.length?'<details><summary>已订正 '+fixed.length+' 题，仍可复习</summary>'+fixed.map(([id],i)=>quizHTML(id,i+1,true)).join('')+'</details>':'');}
function dataView(){const attempts=Object.values(state.answers).reduce((n,a)=>n+a.length,0);return'<p class="eyebrow">只留在你手里</p><h1>进度备份</h1><div class="panel"><p>已保存 '+attempts+' 次作答；'+state.completed.filter(Boolean).length+' 个模块完成。数据只使用当前浏览器的 <code>fr_grammar_v1</code> 一个存储键。</p><p>导出 JSON 后传到另一台设备，在那边打开同一个页面并导入。导入会替换本机进度，不合并；建议先导出本机记录。</p><div class="actions"><button class="primary" data-action="export">导出进度 JSON</button><label class="file" for="importFile">导入进度 JSON</label><input id="importFile" class="sr-only" type="file" accept=".json,application/json"></div><p id="importStatus" role="status"></p></div><div class="notice">隐私窗口、清理浏览器数据、移动或重命名文件，都可能让原进度不可用。不同浏览器和 file 文件地址的存储行为不同，请定期导出。'+(!storageOK?'当前浏览器无法写入持久存储，请立即导出。':'')+'</div><p>网页不登录、不联网，也不上传进度；导出文件含作答记录和你写的句子。</p>';}
let route='home';
function render(){updateTop();let html;if(route==='home')html=home();else if(/^m[0-7]$/.test(route)){const m=+route.slice(1);html=m<5?grammarView(m):m===5?trainerView():m===6?vocabView():acceptanceView();}else html=route==='wrong'?wrongView():route==='data'?dataView():route==='pastExam'?pastExamView():home();$('#main').innerHTML=html;detectVoice();}
function go(dest){if(route===dest){render();window.scrollTo(0,0);return;}location.hash=dest;}
function handleRoute(){const dest=location.hash.slice(1);route=/^(home|wrong|data|pastExam|m[0-7])$/.test(dest)?dest:'home';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
window.addEventListener('hashchange',handleRoute);
$('#homeBtn').addEventListener('click',()=>go('home'));$('#wrongBtn').addEventListener('click',()=>go('wrong'));$('#dataBtn').addEventListener('click',()=>go('data'));
let cursorPositions=new Map();
document.addEventListener('selectionchange',()=>{const e=document.activeElement;if(e?.id&&(e.tagName==='INPUT'||e.tagName==='TEXTAREA')&&typeof e.selectionStart==='number')cursorPositions.set(e.id,[e.selectionStart,e.selectionEnd]);});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-accent]');if(b){const input=document.getElementById(b.dataset.target);if(input&&typeof input.selectionStart==='number')cursorPositions.set(input.id,[input.selectionStart,input.selectionEnd]);e.preventDefault();}});
$('#main').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.route){go(b.dataset.route);return;}
 if(b.dataset.ruleRoute){const dest=b.dataset.ruleRoute,id=b.dataset.ruleId;go(dest);setTimeout(()=>document.getElementById(id)?.scrollIntoView({block:'start'}),60);return;}
 if(b.dataset.speak){if(!frenchVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.speak);u.lang='fr-FR';u.voice=frenchVoice;u.rate=.88;u.onerror=()=>{frenchVoice=null;document.querySelectorAll('.speak').forEach(x=>x.hidden=true);};speechSynthesis.speak(u);}catch{frenchVoice=null;document.querySelectorAll('.speak').forEach(x=>x.hidden=true);}return;}
 if(b.dataset.accent){const input=document.getElementById(b.dataset.target);if(!input||input.disabled)return;const pos=cursorPositions.get(input.id)||[input.selectionStart??input.value.length,input.selectionEnd??input.value.length];input.focus({preventScroll:true});input.setRangeText(b.dataset.accent,pos[0],pos[1],'end');cursorPositions.set(input.id,[input.selectionStart,input.selectionEnd]);input.dispatchEvent(new Event('input',{bubbles:true}));return;}
 if(b.dataset.choice!==undefined){submitQuestion(b.dataset.q,b.dataset.choice,b.closest('[data-question]'));return;}
 if(b.dataset.retry){const box=b.closest('[data-question]');box.querySelectorAll('form button,form input,.choices button').forEach(x=>x.disabled=false);box.querySelector('.result').innerHTML='';const inp=box.querySelector('input');if(inp){inp.value='';inp.focus();}return;}
 switch(b.dataset.action){
 case'start':startRound();break;
 case'acceptPresent':startRound('accept');break;
 case'next':round.index++;round.answered=false;render();$('#conjInput')?.focus({preventScroll:true});break;
 case'again':startRound(round?.mode||'normal');break;
 case'endRound':round=null;render();break;
 case'restartPast':pastSession={};render();break;
 case'export':{try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fr_grammar_v1-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已请求下载进度文件；可在浏览器的下载列表里查看。');}catch{toast('此浏览器未能下载文件，请换用支持文件下载的浏览器。');}break;}
 }
});
function submitQuestion(id,input,box){const d=questionData(id);if(!input.trim()){toast('先写一个答案。');return;}if(route==='pastExam'&&pastSession[id]===undefined){pastSession[id]=normalizeGrammar(input)===normalizeGrammar(d.answer);}answerQuiz(id,input,box);if(route==='pastExam')$('#pastScore').textContent=pastScoreText();}
$('#main').addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='trainerForm'){
 if(!round||round.answered)return;const input=$('#conjInput').value;if(!input.trim()){toast('先写一个答案。');return;}const q=round.questions[round.index],ok=normalizeConj(input)===conjugate(V[q.inf],q.t,q.p,q.g);round.answered=true;round.lastInput=input;round.lastOK=ok;round.results.push(ok);if(ok)round.correct++;record(idConj(q),input,ok);render();
 }else if(form.dataset.quiz)submitQuestion(form.dataset.quiz,form.elements.answer.value,form.closest('[data-question]'));});
$('#main').addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='jump'&&el.value!==''){go('m'+el.value);return;}
 if(el.dataset.complete!==undefined){state.completed[+el.dataset.complete]=el.checked;save();return;}
 if(el.dataset.check!==undefined){state.checks[+el.dataset.check]=el.checked;state.completed[7]=state.checks.every(Boolean);save();$('#acceptStatus').textContent=state.completed[7]?'四项已通过，验收模块已完成。接着继续写自己的短文。':'完成 '+state.checks.filter(Boolean).length+' / 4 项；全部勾选后自动完成本模块。';return;}
 if(['pool','verb','tense','gender'].includes(el.id)){config[el.id]=el.value;if(el.id==='pool'){config.verb='all';render();}return;}
 if(['refVerb','refTense','refGender'].includes(el.id)){$('#refTable').innerHTML=tableHTML({inf:$('#refVerb').value,t:$('#refTense').value,g:$('#refGender').value});return;}
 if(el.id==='hideMeaning'){document.querySelectorAll('.meaning').forEach(x=>x.hidden=el.checked);return;}
 if(el.id==='importFile'){
  const file=el.files[0];if(!file)return;const status=$('#importStatus');status.textContent='正在检查文件…';
  try{if(file.size>20*1024*1024)throw Error('文件超过 20 MB');const incoming=validate(JSON.parse(await file.text()));state=incoming;round=null;pastSession=null;save();status.textContent=storageOK?'导入成功，进度已替换并保存。':'导入成功，但浏览器未能持久保存；请保留原 JSON 文件。';}catch(err){status.textContent='没有导入，原进度保持不变：'+(err instanceof SyntaxError?'JSON 文件损坏或格式错误':err.message);}
  el.value='';
 }
});
$('#main').addEventListener('input',e=>{const el=e.target;if(el.id==='wordSearch'){$('#words').innerHTML=wordsHTML(el.value);document.querySelectorAll('.meaning').forEach(x=>x.hidden=$('#hideMeaning').checked);detectVoice();}if(el.id==='writing'){state.writing=el.value;save();}});
handleRoute();detectVoice();if(loadNotice)toast(loadNotice);
/* APP_NEXT */
</script>
